name: Portfolio static QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/validate_portfolio.py'
      - '.github/workflows/portfolio-qa.yml'
  push:
    branches:
      - 'feat/bg-evgeni-portfolio'
permissions:
  contents: read
jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate HTML, links, images and JavaScript
        run: python3 scripts/validate_portfolio.py
